<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Resolução colaborativa de problemas</title>
<meta name="description" content="Palestra para servidores e gestores públicos sobre formulação de problemas complexos e resolução colaborativa.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@700&family=DM+Mono:wght@400;500&family=DM+Serif+Display&family=Figtree:wght@400..900&display=swap" rel="stylesheet">
<style>
:root{
  --stage-bg:#0E0B18;--paper:#EFEDF5;--card:#FFFFFF;--ink:#17122B;--ink2:#4E4866;--line:#D4D0E2;--night:#15102A;
  --teal:#00C4CC;--blue:#4F6BF5;--violet:#7D2AE8;--pink:#E44DB5;--gold:#F2B300;--bad:#E5484D;--good:#11A15A;
  --grad:linear-gradient(118deg,#00C4CC 0%,#4F6BF5 48%,#7D2AE8 100%);
  --grad-soft:linear-gradient(118deg,#D6F7F8 0%,#E2E6FE 50%,#EEE2FC 100%);
  --ease:cubic-bezier(.2,.75,.2,1);
  --chrome-bg:#0E0B18;--chrome-fg:#F4F2FA;--chrome-mute:#9C97B3;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--chrome-bg:#0A0812;--chrome-fg:#F4F2FA;--chrome-mute:#8E88A8}}
:root[data-theme="dark"]{--chrome-bg:#0A0812;--chrome-fg:#F4F2FA;--chrome-mute:#8E88A8}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#0E0B18;background:var(--chrome-bg);color:var(--chrome-fg);font-family:Figtree,system-ui,sans-serif;overflow:hidden}
button{font:inherit;color:inherit}

/* chrome */
.app{height:100vh;height:100dvh;display:flex;flex-direction:column}
.view{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:14px 16px 8px;gap:12px}
.stage{position:relative;width:min(100%,calc((100dvh - 132px - var(--nh,0px)) * 16 / 9));aspect-ratio:16/9;container-type:inline-size;background:var(--paper);border-radius:14px;overflow:hidden;box-shadow:0 30px 80px rgba(0,0,0,.55)}
.notes-pane{display:none;width:min(100%,calc((100dvh - 330px) * 16 / 9));min-width:280px;background:#15102A;color:#EDEAF6;border-radius:12px;padding:12px 20px;max-height:170px;overflow:auto}
.app.notes-on .notes-pane{display:block}
.app.notes-on{--nh:200px}
.notes-pane .nh{font:500 13px 'DM Mono',monospace;letter-spacing:.04em;text-transform:uppercase;color:#4FE3E8;margin-bottom:6px}
.notes-pane p{font:400 17px/1.5 Figtree,sans-serif;margin:0 0 6px}
.notes-pane .nx{font:400 13px 'DM Mono',monospace;color:#9C97B3}
.ctrl{width:min(100%,1100px);display:flex;align-items:center;gap:10px;height:50px}
.ctrl button{background:rgba(255,255,255,.08);border:0;border-radius:99px;height:36px;min-width:36px;padding:0 14px;cursor:pointer;font:500 14px 'DM Mono',monospace;color:#F4F2FA;white-space:nowrap}
.ctrl button:hover{background:rgba(255,255,255,.16)}
.ctrl button:focus-visible,.stage button:focus-visible,.index button:focus-visible{outline:3px solid var(--teal);outline-offset:2px}
#cnt,#clock{font:500 13px 'DM Mono',monospace;color:#C9C4DE;white-space:nowrap}
.bar{flex:1;display:flex;gap:3px;height:12px;min-width:120px}
.seg{border:0;padding:0;margin:0;background:rgba(255,255,255,.14);border-radius:4px;overflow:hidden;cursor:pointer;height:12px;min-width:10px}
.seg i{display:block;height:100%;width:0;background:var(--grad);transition:width .6s var(--ease)}
.seg:hover{background:rgba(255,255,255,.26)}
.hint{position:fixed;right:18px;bottom:72px;font:400 13px 'DM Mono',monospace;color:#9C97B3;background:rgba(14,11,24,.8);padding:8px 12px;border-radius:99px;transition:opacity .8s}
.hint.off{opacity:0}
.index{position:fixed;inset:0;background:rgba(10,8,18,.96);z-index:20;overflow:auto;padding:36px 5vw}
.index[hidden]{display:none}
.ix-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px;font:500 15px 'DM Mono',monospace}
.ix-h button{background:rgba(255,255,255,.1);border:0;border-radius:99px;padding:8px 16px;color:#fff;cursor:pointer;font:500 13px 'DM Mono',monospace}
.ix-b{margin-bottom:22px}
.ix-b h4{font:700 16px Figtree,sans-serif;color:#4FE3E8;margin:0 0 10px;display:flex;gap:12px;align-items:baseline}
.ix-b h4 span{font:400 13px 'DM Mono',monospace;color:#9C97B3}
.ix-g{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:8px}
.ix-g button{text-align:left;background:rgba(255,255,255,.06);border:0;border-radius:10px;padding:10px 12px;cursor:pointer;color:#F4F2FA;font:500 14px Figtree,sans-serif;display:flex;gap:10px}
.ix-g button span{font:500 12px 'DM Mono',monospace;color:#9C97B3;padding-top:2px}
.ix-g button.opt{border:1px dashed rgba(242,179,0,.6)}
.ix-g button:hover{background:rgba(255,255,255,.14)}

/* slide base */
.slide{position:absolute;inset:0;padding:6.4cqw 5cqw 6.2cqw;display:flex;flex-direction:column;background:var(--paper);color:var(--ink);opacity:0;visibility:hidden;transform:translateX(0);transition:opacity .7s var(--ease),transform .9s var(--ease),visibility .9s;overflow:hidden}
.slide.on{opacity:1;visibility:visible;transform:none}
.slide.past{opacity:0;visibility:hidden;transform:translateX(-1.2cqw)}
.slide.dark{background:var(--night);color:#fff}
.slide.white{background:#fff}
.slide.grad{background:var(--grad);color:#fff}
.slide.cover{padding:0;background:radial-gradient(70cqw 60cqw at 78% 42%,#E7E1FF 0%,var(--paper) 62%)}
.meta{position:absolute;left:5cqw;right:5cqw;bottom:2cqw;display:flex;justify-content:space-between;font:500 1.25cqw 'DM Mono',monospace;color:var(--ink2);letter-spacing:.03em;text-transform:uppercase}
.meta b{color:var(--ink);font-weight:500}
.dark .meta,.grad .meta{color:#A9A3C4}
.dark .meta b,.grad .meta b{color:#fff}
.opt-tag{position:absolute;top:2.6cqw;right:5cqw;font:500 1.25cqw 'DM Mono',monospace;text-transform:uppercase;letter-spacing:.06em;background:var(--gold);color:var(--ink);border-radius:99px;padding:.4cqw 1.1cqw}

.kick{font:500 1.3cqw 'DM Mono',monospace;letter-spacing:.06em;text-transform:uppercase;color:var(--violet);margin-bottom:1.4cqw}
.dark .kick{color:var(--teal)}
.grad .kick{color:#fff}
.t{font:800 3.8cqw/1.1 Figtree,sans-serif;letter-spacing:-.03em;margin:0 0 2.2cqw;color:inherit;text-wrap:balance;max-width:88cqw}
.lead{font:400 1.9cqw/1.45 Figtree,sans-serif;color:var(--ink2);margin:0 0 2.4cqw;max-width:72ch;text-wrap:pretty}
.dark .lead{color:#C9C4DE}
.grad .lead{color:#F4F2FA}
.micro{font:400 1.3cqw 'DM Mono',monospace;color:var(--ink2);margin:1.4cqw 0 0;letter-spacing:.02em}
.dark .micro{color:#A9A3C4}
.gt{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.grad .gt{background:none;-webkit-text-fill-color:#fff;color:#fff}

/* split de palavras */
.w{display:inline-block;overflow:hidden;vertical-align:top;padding:0 .05em .16em;margin:0 -.05em -.16em}
.w>span{display:inline-block;transform:translateY(105%);transition:transform .85s var(--ease) calc(var(--i)*.07s + .1s)}
.on .w>span{transform:none}

/* marca-texto */
.hl{position:relative;isolation:isolate;display:inline}
.hl::before{content:"";position:absolute;left:-.2em;right:-.2em;bottom:.14em;height:.5em;background:rgba(0,196,204,.42);z-index:-1;border-radius:.15em;transform:scaleX(0);transform-origin:left;transition:transform .9s var(--ease) var(--d,0s)}
.on .hl::before{transform:scaleX(1)}

/* entradas e fragmentos */
.enter{opacity:0;transform:translateY(2cqw);transition:opacity .7s var(--ease) calc(var(--i,0)*.12s + .15s),transform .8s var(--ease) calc(var(--i,0)*.12s + .15s)}
.on .enter{opacity:1;transform:none}
.frag{opacity:0;transform:translateY(1.2cqw);transition:opacity .6s var(--ease),transform .7s var(--ease)}
.frag.show{opacity:1;transform:none}

/* layout */
.grid{display:grid;gap:1.8cqw}
.g2{grid-template-columns:1fr 1fr}
.g3{grid-template-columns:repeat(3,1fr)}
.g4{grid-template-columns:repeat(4,1fr)}
.row{display:flex;gap:2.4cqw;align-items:stretch}
.col{flex:1;min-width:0}
.card{background:#fff;border-radius:1.2cqw;padding:1.9cqw 2.1cqw;color:var(--ink);position:relative}
.card h3{font:800 2.2cqw/1.15 Figtree,sans-serif;letter-spacing:-.02em;margin:0 0 1cqw}
.card p{font:400 1.5cqw/1.45 Figtree,sans-serif;color:var(--ink2);margin:0;text-wrap:pretty}
.card b{color:var(--ink);font-weight:700}
.card.dk{background:var(--night);color:#fff}
.card.dk p{color:#CFCAE3}
.card.dk h3{color:#fff}
.ico{width:3.6cqw;height:3.6cqw;border-radius:50%;background:var(--grad-soft);display:grid;place-items:center;font:800 1.7cqw Figtree,sans-serif;color:var(--ink);margin-bottom:.9cqw}
.chip{display:inline-block;font:500 1.35cqw 'DM Mono',monospace;padding:.5cqw 1.2cqw;border-radius:99px;background:var(--grad-soft);color:var(--ink);margin-top:1.2cqw}
.pill{display:inline-block;border-radius:99px;padding:.45cqw 1.3cqw;font:500 1.35cqw 'DM Mono',monospace;background:var(--ink);color:#fff;white-space:nowrap}
.pill.g{background:var(--grad)}
.quote{font:800 2.7cqw/1.2 Figtree,sans-serif;letter-spacing:-.025em;color:var(--ink);margin:0;text-wrap:balance}
.dark .quote{color:#fff}
.bigq{font:800 4.6cqw/1.12 Figtree,sans-serif;letter-spacing:-.035em;margin:0;text-wrap:balance}
.dark .bigq,.grad .bigq{color:#fff}
.pergunta{background:#fff;border-radius:1.2cqw;padding:1.9cqw 2.3cqw;font:700 2.1cqw/1.3 Figtree,sans-serif;color:var(--ink);letter-spacing:-.01em}
.pergunta::before{content:"Pergunta";display:block;font:500 1.3cqw 'DM Mono',monospace;color:var(--violet);text-transform:uppercase;letter-spacing:.06em;margin-bottom:.8cqw}
.dark .pergunta{background:rgba(255,255,255,.07);color:#fff}
.dark .pergunta::before{color:var(--teal)}
.trow{display:grid;grid-template-columns:19cqw 1fr 1fr;gap:2.4cqw;background:#fff;border-radius:1.2cqw;padding:1.1cqw 2.2cqw;align-items:center}
.trow b{font:800 2.1cqw Figtree,sans-serif;color:var(--ink);letter-spacing:-.01em}
.trow span{font:400 1.5cqw/1.35 Figtree,sans-serif;color:var(--ink2)}
.trow span em{font-style:normal;color:var(--ink);font-weight:600}
.lbl{font:500 1.3cqw 'DM Mono',monospace;text-transform:uppercase;letter-spacing:.06em;color:var(--ink2)}

/* capa de bloco */
.bc{position:absolute;left:5cqw;top:0;bottom:0;right:5cqw;display:flex;flex-direction:column;justify-content:center}
.bc-n{font:500 14cqw/1 'DM Mono',monospace;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;letter-spacing:-.02em;margin-bottom:2cqw}
.bc .t1{font:800 6cqw/1.05 Figtree,sans-serif;letter-spacing:-.035em;color:#fff;margin:0 0 2.6cqw;max-width:60cqw;text-wrap:balance}
.bc-p{display:flex;align-items:center;gap:1.6cqw}
.bc-s{font:400 1.5cqw Figtree,sans-serif;color:#C9C4DE}
.bmeta{font:500 1.3cqw 'DM Mono',monospace;color:#A9A3C4;margin-top:2.6cqw;letter-spacing:.04em;text-transform:uppercase}
.rings{position:absolute;right:6cqw;top:50%;transform:translateY(-50%);width:20cqw;height:20cqw;display:grid;grid-template-columns:repeat(3,1fr);gap:2.4cqw}
.rings .r{border-radius:50%;border:.3cqw solid rgba(255,255,255,.3);aspect-ratio:1}
.rings .r.f{background:var(--grad);border:0}
.rings .r.t{border:.3cqw solid var(--teal)}

/* capa */
.cv{position:absolute;inset:0}
.cv-t{position:absolute;left:6cqw;top:0;bottom:0;width:50cqw;display:flex;flex-direction:column;justify-content:center;z-index:2}
.kick-line{display:flex;align-items:center;gap:1.2cqw}
.kick-line::before{content:"";width:4cqw;height:.22cqw;background:var(--grad);border-radius:2px}
.cv-h{font:800 7.2cqw/1.02 Figtree,sans-serif;letter-spacing:-.04em;margin:0 0 2.6cqw;color:var(--ink)}
.cv-s{font:300 2.3cqw/1.35 Figtree,sans-serif;color:var(--ink2);margin:0 0 4cqw;max-width:34cqw}
.cv-s b{font-weight:700;color:var(--ink)}
.cv-f{font:500 1.3cqw 'DM Mono',monospace;letter-spacing:.05em;text-transform:uppercase;color:var(--ink2)}
.scene{position:absolute;right:0;top:0;width:52cqw;height:100%;perspective:90cqw;z-index:1}
.dp{position:absolute;transition:transform .5s var(--ease);will-change:transform}
.fl{animation:float 7s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-1.4cqw)}}
.sph{width:13cqw;height:13cqw;border-radius:50%;background:radial-gradient(circle at 32% 28%,#fff 0%,#9FF3F6 14%,#00C4CC 42%,#4F6BF5 75%,#7D2AE8 100%);box-shadow:inset -1.2cqw -1.4cqw 2.4cqw rgba(60,20,120,.35),0 2cqw 3cqw rgba(60,20,120,.15)}
.ring{width:11cqw;height:11cqw;border-radius:50%;border:2.6cqw solid transparent;background:linear-gradient(#EFEDF5,#EFEDF5) padding-box,var(--grad) border-box;box-shadow:0 1.2cqw 2cqw rgba(60,20,120,.15)}
.cube{width:8.5cqw;height:8.5cqw;border-radius:1.6cqw;transform:rotate(18deg);background:linear-gradient(140deg,#E44DB5,#7D2AE8 60%,#4F6BF5);box-shadow:inset 0 .6cqw 1.6cqw rgba(255,255,255,.5),0 2cqw 3cqw rgba(125,42,232,.3)}
.sheet{width:19cqw;background:#fff;border-radius:1.2cqw;padding:1.6cqw;box-shadow:0 2cqw 4cqw rgba(23,18,43,.14);transform:rotate(-6deg)}
.sheet i{display:block;height:1.3cqw;border-radius:99px;background:var(--line);margin-bottom:1cqw}
.sheet i.g{background:var(--grad);width:62%}
.sheet i.s{width:78%}
.chipx{background:#fff;border-radius:99px;padding:.9cqw 1.6cqw;font:500 1.5cqw 'DM Mono',monospace;color:var(--ink);box-shadow:0 1.2cqw 2.4cqw rgba(23,18,43,.12);white-space:nowrap}
.chipx b{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.sh{position:absolute;left:50%;bottom:4cqw;width:44cqw;height:3cqw;transform:translateX(-50%);background:radial-gradient(closest-side,rgba(23,18,43,.18),transparent)}
.sig{font:700 11cqw/1 Caveat,cursive;color:var(--violet);margin:0 0 2cqw;opacity:0;transform:translateY(2cqw);transition:opacity 1.2s var(--ease) .3s,transform 1.2s var(--ease) .3s}
.on .sig{opacity:1;transform:none}

/* checklist */
.checklist{display:grid;grid-template-columns:repeat(5,1fr);gap:1.6cqw;margin-top:1cqw}
.ctile{all:unset;box-sizing:border-box;cursor:pointer;background:#fff;border-radius:1.2cqw;padding:2.2cqw 1.8cqw;min-height:21cqw;display:flex;flex-direction:column;gap:1.3cqw;position:relative;transition:background .5s var(--ease),color .5s var(--ease)}
.ctile:focus-visible{outline:.3cqw solid var(--teal);outline-offset:.4cqw}
.ctile .n{font:500 1.4cqw 'DM Mono',monospace;color:var(--violet)}
.ctile b{font:800 2.1cqw/1.2 Figtree,sans-serif;letter-spacing:-.01em;padding-right:3cqw;color:var(--ink)}
.ctile .ck{position:absolute;top:1.8cqw;right:1.8cqw;width:3.2cqw;height:3.2cqw;border-radius:50%;border:.25cqw solid var(--line);display:grid;place-items:center;transition:transform .5s var(--ease),background .4s,border-color .4s}
.ctile .ck svg{width:1.8cqw;height:1.8cqw;opacity:0;transition:opacity .3s}
.ctile.done{background:var(--night)}
.ctile.done b{color:#fff}
.ctile.done .n{color:var(--teal)}
.ctile.done .ck{background:var(--good);border-color:var(--good);transform:scale(1.12)}
.ctile.done .ck svg{opacity:1}
.ctile.done .ck svg path{stroke:#fff}

/* votação */
.vote{display:grid;grid-template-columns:1fr 1fr;gap:2cqw;margin-top:1cqw}
.vopt{cursor:pointer;background:#fff;border:0;border-radius:1.2cqw;padding:2.2cqw 2.4cqw;color:var(--ink);position:relative;overflow:hidden;display:flex;flex-direction:column;gap:1.4cqw;min-height:20cqw;text-align:left;text-wrap:pretty}
.vopt:focus-visible{outline:.3cqw solid var(--teal);outline-offset:.4cqw}
.vopt b{font:700 2.1cqw/1.3 Figtree,sans-serif;letter-spacing:-.01em;padding-right:1cqw}
.vopt .vn{font:800 4.6cqw/1 Figtree,sans-serif;color:var(--violet);transition:transform .3s var(--ease);display:inline-block;margin-top:auto}
.vopt .vn.bump{transform:scale(1.25)}
.vopt .vb{position:absolute;left:0;bottom:0;height:1.1cqw;width:100%;background:var(--grad-soft)}
.vopt .vb i{display:block;height:100%;width:0;background:var(--grad);transition:width .6s var(--ease)}

/* cronômetro */
.timer{display:flex;align-items:center;gap:2cqw;margin-top:2.4cqw}
.tbtn{cursor:pointer;background:var(--ink);border:0;color:#fff;border-radius:99px;padding:1cqw 2.4cqw 1cqw 1.2cqw;display:flex;align-items:center;gap:1.4cqw;font:500 1.7cqw 'DM Mono',monospace;min-width:14cqw}
.tbtn:focus-visible{outline:.3cqw solid var(--teal);outline-offset:.4cqw}
.tbtn svg{width:4.6cqw;height:4.6cqw;transform:rotate(-90deg);flex:none}
.tr{fill:none;stroke:rgba(255,255,255,.2);stroke-width:4}
.tp{fill:none;stroke:url(#gr);stroke-width:4;stroke-linecap:round;stroke-dasharray:106.81;stroke-dashoffset:0;transition:stroke-dashoffset .9s linear}
.timer.run .tbtn{background:var(--violet)}
.timer.done .tbtn{animation:blink .45s steps(2) 3}
@keyframes blink{50%{opacity:.15}}
.tl{font:400 1.7cqw/1.4 Figtree,sans-serif;color:var(--ink2)}
.dark .tl{color:#C9C4DE}

/* cartões que viram */
.flipg{display:grid;grid-template-columns:repeat(3,1fr);gap:2cqw;margin-top:1cqw}
.flip{perspective:90cqw;height:19cqw;cursor:pointer}
.flip:focus-visible{outline:.3cqw solid var(--teal);outline-offset:.4cqw}
.fi{position:relative;width:100%;height:100%;transform-style:preserve-3d;transition:transform .9s var(--ease)}
.flip.show .fi{transform:rotateY(180deg)}
.ff,.fb{position:absolute;inset:0;-webkit-backface-visibility:hidden;backface-visibility:hidden;border-radius:1.2cqw;padding:2.2cqw 2.4cqw;display:flex;flex-direction:column;justify-content:center}
.ff{background:#fff;color:var(--ink)}
.ff b{font:800 2.5cqw/1.2 Figtree,sans-serif;letter-spacing:-.02em}
.ff span{font:500 1.3cqw 'DM Mono',monospace;color:var(--violet);text-transform:uppercase;letter-spacing:.06em;margin-bottom:1.2cqw}
.fb{background:var(--grad);color:#fff;transform:rotateY(180deg)}
.fb.bad{background:var(--bad)}
.fb b{font:800 2.3cqw/1.25 Figtree,sans-serif;letter-spacing:-.01em}

/* antes/depois */
.swap{position:relative;height:19cqw;border-radius:1.2cqw;overflow:hidden;cursor:pointer;margin-top:1cqw}
.swap:focus-visible{outline:.3cqw solid var(--teal);outline-offset:.4cqw}
.sw{position:absolute;inset:0;padding:2.2cqw 2.8cqw;display:flex;flex-direction:column;justify-content:center;gap:1cqw}
.sw-a{background:#fff;color:var(--ink);z-index:0}
.sw-b{background:var(--grad);color:#fff;z-index:1;clip-path:inset(0 100% 0 0);transition:clip-path 1.4s var(--ease)}
.swap.rev .sw-b{clip-path:inset(0 0 0 0)}
.sw b{font:800 2.5cqw/1.2 Figtree,sans-serif;letter-spacing:-.02em}
.sw span.k{font:500 1.3cqw 'DM Mono',monospace;text-transform:uppercase;letter-spacing:.06em;opacity:.85}
.sweep{position:absolute;top:-10%;bottom:-10%;width:7cqw;background:linear-gradient(90deg,transparent,rgba(255,255,255,.75),transparent);transform:skewX(-12deg);z-index:2;left:-10%;pointer-events:none}
.swap.rev .sweep{animation:sw 1.4s var(--ease) forwards}
@keyframes sw{from{left:-10%}to{left:104%}}
.lab{position:absolute;top:1.8cqw;right:2cqw;z-index:3;font:500 1.3cqw 'DM Mono',monospace;color:#fff;border-radius:99px;padding:.4cqw 1.2cqw;letter-spacing:.04em;text-transform:uppercase}
.lab.l1{background:var(--bad)}
.lab.l2{background:var(--good)}
.swap .lab.l2{display:none}
.swap.rev .lab.l1{display:none}
.swap.rev .lab.l2{display:inline-block}

/* círculos (movimento 2) */
.circ{position:relative;width:31cqw;height:31cqw;flex:none}
.circ i{position:absolute;left:50%;top:50%;border-radius:50%;transform:translate(-50%,-50%)}
.c1{width:100%;height:100%;background:var(--grad-soft)}
.c2{width:66%;height:66%;background:linear-gradient(118deg,#B9E9F9,#C9D2FA)}
.c3{width:34%;height:34%;background:var(--grad)}
.dot{position:absolute;width:3.4cqw;height:3.4cqw;border-radius:50%;background:var(--ink);color:#fff;font:700 1.5cqw Figtree,sans-serif;display:grid;place-items:center;transform:translate(-50%,-50%)}
.legend{display:flex;flex-direction:column;gap:1cqw;justify-content:center;flex:1}
.legend .card{padding:1cqw 1.8cqw}
.legend .card h3{font-size:1.8cqw;margin-bottom:.4cqw}
.legend .card p{font-size:1.4cqw}

/* fluxo, ZIP, agenda */
.flow{display:grid;grid-template-columns:1fr 3cqw 1fr 3cqw 1fr 3cqw 1fr;align-items:stretch}
.flow .card{display:flex;flex-direction:column;justify-content:center;min-height:14cqw}
.flow .card b{font:800 2.2cqw/1.2 Figtree,sans-serif;letter-spacing:-.015em}
.flow .arr{display:flex;align-items:center;justify-content:center;font:800 3.4cqw Figtree,sans-serif;color:var(--violet)}
.zl{font:800 6cqw/1 Figtree,sans-serif;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;margin-bottom:1.4cqw}
.ag{display:grid;grid-template-columns:9cqw 1fr 8cqw;align-items:center;padding:1.1cqw 0;border-bottom:.15cqw solid var(--line);opacity:0;transform:translateX(-2cqw);transition:opacity .6s var(--ease) calc(var(--i)*.09s + .1s),transform .7s var(--ease) calc(var(--i)*.09s + .1s)}
.on .ag{opacity:1;transform:none}
.ag .agt{font:500 1.4cqw 'DM Mono',monospace;color:var(--violet)}
.ag .agn{font:700 2.2cqw Figtree,sans-serif;letter-spacing:-.01em}
.ag .agm{font:500 1.3cqw 'DM Mono',monospace;color:var(--ink2);text-align:right}

@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{transition-duration:.01ms!important;transition-delay:0s!important;animation-duration:.01ms!important;animation-iteration-count:1!important}
}
</style>

  </div>
  <div class="pergunta frag" data-f="1" style="margin-top:2.2cqw;font-size:2cqw">Estiagem cada vez maior, 300 mil cisternas para entregar. Qual você escolhe?</div>` },

{ b:'b3', min:1, t:'Dialética × dialógica',
  notes:'Na leitura popular de Hegel, a contradição vira tese, antítese e síntese. Para Morin, os dois princípios permanecem juntos. Cite o conceito, não a edição.',
  html:`${head('Dialética × dialógica', 'Troque o “ou” pelo “e”.')}
  <div class="grid g2">
    <div class="card enter" style="--i:0"><h3>Dialética, leitura popular</h3><p>Tese, antítese, síntese: a contradição se resolve num terceiro termo.</p></div>
    <div class="card dk enter" style="--i:1"><h3>Dialógica (Morin)</h3><p>Dois princípios necessários e antagônicos, que permanecem juntos.</p></div>
  </div>
  <p class="quote frag" data-f="1" style="margin-top:2.8cqw">Muitas más políticas nascem de resolver cedo um <span class="gt">“e” lido como “ou”.</span></p>` },

/* ---------- Bloco 4 ---------- */
{ b:'b4', min:0, t:'Bloco 04 · O erro padrão', cls:'dark', meta:false,
  notes:'Anuncie o bloco: o erro mais comum é tratar o complexo como complicado.',
  html:bcov('b4','O erro padrão','oftoooooo','Tratar o complexo como complicado')},

{ b:'b4', min:2, t:'Ciclo do erro',
  notes:'Leia as quatro etapas em sequência e pare em “faltou execução”. Pergunte: alguém checou se o problema estava bem formulado?',
  html:`${head('O ciclo do erro', 'A explicação mais comum: “faltou execução”.')}
  <div class="flow">
    <div class="card enter" style="--i:0"><b>Diagnóstico fechado</b></div><div class="arr enter" style="--i:1">→</div>
    <div class="card enter" style="--i:2"><b>Solução única</b></div><div class="arr enter" style="--i:3">→</div>
    <div class="card enter" style="--i:4"><b>Implementação linear</b></div><div class="arr enter" style="--i:5">→</div>
    <div class="card dk enter" style="--i:6"><b style="color:#fff">Faltou execução</b></div>
  </div>
  <p class="quote frag" data-f="1" style="margin-top:3.4cqw">Simplificar o problema não simplifica a realidade. <span class="gt">Transfere o custo</span> para quem implementa.</p>` },

{ b:'b4', min:2, t:'Minha Casa Minha Vida',
  notes:'Mostre as duas colunas: a ideia e o que as pesquisas em 22 municípios registraram. Termine com a pergunta e espere.',
  html:`${head('Caso · Minha Casa Minha Vida, Faixa 1', 'Casa entregue é política entregue?')}
  <div class="grid g2">
    <div class="card enter" style="--i:0"><h3>A ideia</h3><p>Moradia em escala para famílias de baixíssima renda, com subsídio alto, em conjuntos padronizados e terrenos baratos.</p></div>
    <div class="card enter" style="--i:1"><h3>Pesquisas em 22 municípios</h3><p>Áreas rurais antigas, sem transporte, serviço ou emprego. Taxas acima da renda. Em alguns casos, gestão tomada por milícia ou tráfico. Planta de dois quartos que não comporta família grande.</p></div>
  </div>
  <div class="pergunta frag" data-f="1" style="margin-top:2.2cqw;font-size:2cqw">Uma família saiu do aluguel em área de risco e ganhou casa a 2 horas do trabalho. Deu certo ou errado?</div>` },

/* ---------- Bloco 5 ---------- */
{ b:'b5', min:0, t:'Bloco 05 · A resposta: resolução colaborativa', cls:'dark', meta:false,
  notes:'Anuncie o bloco: não é uma resposta mágica. É um método para formular melhor antes de decidir.',
  html:bcov('b5','A resposta: resolução colaborativa como método','ofofoooft','Um método, não um slogan')},

{ b:'b5', min:2, t:'Inovação como mediação',
  notes:'Diga que inovação pública não é o setor das ideias novas. Diga a nota: aqui design não é estética e inovação não é criatividade.',
  html:`${head('Ideia central', 'Inovação pública é uma forma de governar a incerteza.')}
  <p class="lead enter" style="--i:0">Organiza múltiplas lógicas num processo de aprendizagem e decisão.</p>
  <div class="grid g3" style="gap:1.4cqw">
    <div class="card enter" style="--i:1;padding:1.6cqw 2cqw"><p style="color:var(--ink);font-weight:600">Formular melhor o problema</p></div>
    <div class="card enter" style="--i:2;padding:1.6cqw 2cqw"><p style="color:var(--ink);font-weight:600">Hipóteses explícitas e testáveis</p></div>
    <div class="card enter" style="--i:3;padding:1.6cqw 2cqw"><p style="color:var(--ink);font-weight:600">Aprender com evidência e experiência</p></div>
    <div class="card enter" style="--i:4;padding:1.6cqw 2cqw"><p style="color:var(--ink);font-weight:600">Envolver quem não está na sala</p></div>
    <div class="card enter" style="--i:5;padding:1.6cqw 2cqw"><p style="color:var(--ink);font-weight:600">Testar pequeno, onde o erro é barato</p></div>
    <div class="card enter" style="--i:6;padding:1.6cqw 2cqw"><p style="color:var(--ink);font-weight:600">Ajustar antes de escalar</p></div>
  </div>
  <p class="micro">Aqui, design não é estética e inovação não é criatividade.</p>` },

{ b:'b5', min:1, t:'Modos de conhecer',
  notes:'A maior parte do pensamento sistêmico privilegia o conhecimento de dados e conceitos. Escuta qualificada é conhecimento experiencial.',
  html:`${head('Modos de conhecer', 'Há quatro formas de conhecer, não só a dos dados.')}
  <div class="grid g2" style="gap:1.4cqw">
    <div class="card enter" style="--i:0;padding:1.6cqw 2cqw"><h3 style="margin:0 0 .5cqw">Proposicional</h3><p>Conceitos e dados.</p></div>
    <div class="card enter" style="--i:1;padding:1.6cqw 2cqw"><h3 style="margin:0 0 .5cqw">Experiencial</h3><p>Vivência direta.</p></div>
    <div class="card enter" style="--i:2;padding:1.6cqw 2cqw"><h3 style="margin:0 0 .5cqw">Presentacional</h3><p>Arte e narrativa.</p></div>
    <div class="card enter" style="--i:3;padding:1.6cqw 2cqw"><h3 style="margin:0 0 .5cqw">Prática</h3><p>Saber-fazer.</p></div>
  </div>
  <p class="quote frag" data-f="1" style="margin-top:2.6cqw">Escuta qualificada é conhecimento. <span class="gt">Não é achismo.</span></p>` },

{ b:'b5', min:2, t:'Movimento 1: expandir',
  notes:'Mostre o GIGA-mapping como ideia: mapas grandes, com centenas de entidades, servem para entender e gerar. A tradução para a gestão pública é sua.',
  html:`${head('Movimento 1', 'Expandir antes de simplificar.')}
  <div class="row">
    <div class="col" style="flex:1"><p class="quote enter" style="--i:0;font-size:2.8cqw">Liste tudo o que se relaciona ao problema, <span class="gt">mesmo o que parece irrelevante.</span></p></div>
    <div class="col" style="flex:1"><div class="grid" style="gap:1.1cqw">
      <div class="card enter" style="--i:1;padding:1.5cqw 2cqw"><p>Mapeie o que já se sabe. Assim os pressupostos aparecem.</p></div>
      <div class="card enter" style="--i:2;padding:1.5cqw 2cqw"><p>Olhe as relações. A complexidade mora nelas.</p></div>
      <div class="card enter" style="--i:3;padding:1.5cqw 2cqw"><p>Mapas grandes, com centenas de entidades, servem para entender e gerar.</p></div>
      <div class="card enter" style="--i:4;padding:1.5cqw 2cqw"><p>Não sobre-desenhe o mapa. Ele tem de continuar aberto.</p></div>
    </div></div>
  </div>
  <p class="micro">Adaptado do Systems Oriented Design (Sevaldson).</p>` },

{ b:'b5', min:2, t:'Exercício em duplas',
  notes:'Peça duplas e inicie o cronômetro. Espere os dois minutos inteiros. Depois peça que uma dupla diga quem anotou.',
  html:`${head('Exercício · duplas · 2 minutos', 'Quem não está na mesa?')}
  <p class="lead enter" style="--i:0;max-width:60ch">Pense num problema que você enfrenta hoje. Anote uma pessoa ou grupo que não está nessa conversa.</p>
  <div class="timer enter" data-tot="120" data-rem="120" style="--i:1">
    <button class="tbtn" aria-label="Iniciar ou pausar o cronômetro de dois minutos"><svg viewBox="0 0 40 40" aria-hidden="true"><circle class="tr" cx="20" cy="20" r="17"/><circle class="tp" cx="20" cy="20" r="17"/></svg><span class="tt">2:00</span></button>
    <span class="tl">Aperte para iniciar.</span>
  </div>` },

{ b:'b5', min:1, t:'Movimento 2: convocar',
  notes:'Desenhe os três círculos. Pergunte quem, no problema da sala, está no círculo mais externo.',
  html:`${head('Movimento 2', 'Convoque quem não está na mesa.')}
  <div class="row" style="align-items:center;gap:4cqw">
    <div class="circ enter" style="--i:0">
      <i class="c1"></i><i class="c2"></i><i class="c3"></i>
      <span class="dot" style="left:50%;top:6%">1</span>
      <span class="dot" style="left:50%;top:26%">2</span>
      <span class="dot" style="left:50%;top:50%;background:#fff;color:var(--ink)">3</span>
    </div>
    <div class="legend">
      <div class="card enter" style="--i:1"><h3>1 · Quem é afetado</h3><p>Quem vive o problema. Quase nunca está na sala.</p></div>
      <div class="card enter" style="--i:2"><h3>2 · Quem é consultado</h3><p>Sociedade civil organizada. Às vezes está na sala.</p></div>
      <div class="card enter" style="--i:3"><h3>3 · Quem decide</h3><p>Técnicos e políticos. Sempre estão na sala.</p></div>
      <div class="card dk frag" data-f="1"><p style="color:#fff;font:700 1.8cqw/1.3 Figtree,sans-serif">A participação falha quando alguém <span class="gt">sequer é convidado.</span></p></div>
    </div>
  </div>` },

{ b:'b5', min:1, t:'Carta do ator ausente',
  notes:'Leia em voz alta, devagar, sem comentar. Mostre cada linha com um clique. Diga que é um personagem ilustrativo antes de ler.',
  html:`${head('Carta do ator ausente', 'A pessoa que dorme no prédio há dois anos.')}
  <div class="grid g2" style="gap:1.6cqw">
    <div class="card frag" data-f="1"><span class="lbl" style="display:block;margin-bottom:.8cqw">Interesse</span><h3 style="margin:0">Ter um lugar seguro.</h3></div>
    <div class="card frag" data-f="2"><span class="lbl" style="display:block;margin-bottom:.8cqw">Medo</span><h3 style="margin:0">Virar “questão de segurança”.</h3></div>
    <div class="card frag" data-f="3"><span class="lbl" style="display:block;margin-bottom:.8cqw">Moeda de troca</span><h3 style="margin:0">Nenhuma.</h3></div>
    <div class="card dk frag" data-f="4"><span class="lbl" style="display:block;margin-bottom:.8cqw;color:#A9A3C4">Situação</span><h3 style="margin:0;color:#fff">Não foi convidada.</h3></div>
  </div>` },

{ b:'b5', min:2, t:'Caso Penela',
  notes:'Clique no cartão, ou espere a cortina, para mostrar a troca. Diga que o diagnóstico mudou.',
  html:`${head('Caso · Penela, Portugal', 'O problema estava na formulação.')}
  <div class="swap" id="swap1" tabindex="0" aria-label="Antes e depois: clique para alternar">
    <div class="sw sw-a"><span class="k">Pergunta do diagnóstico</span><b>Quais serviços de justiça levar à comunidade?</b></div>
    <div class="sw sw-b"><span class="k">Problema reformulado</span><b>Restrições de mobilidade e falta de oportunidades explicavam a baixa demanda.</b></div>
    <span class="sweep"></span>
    <span class="lab l1">Antes</span><span class="lab l2">Depois</span>
  </div>
  <div class="grid g2" style="margin-top:2cqw;gap:1.6cqw">
    <p class="micro" style="font-size:1.5cqw;font-family:Figtree,sans-serif;color:var(--ink2)">A abordagem tradicional fragmenta o problema, supõe que poucos especialistas bastam e pode apontar o problema errado.</p>
    <p class="micro" style="font-size:1.5cqw;font-family:Figtree,sans-serif;color:var(--ink2)">Escutar de baixo para cima mudou a pergunta e gerou um conceito novo para testar.</p>
  </div>` },

{ b:'b5', min:1, t:'Movimento 3: testar pequeno',
  notes:'Explique os três critérios da análise ZIP. Feche com o teste pequeno.',
  html:`${head('Movimento 3', 'Localize o ponto de intervenção e teste pequeno.')}
  <div class="grid g3">
    <div class="card enter" style="--i:0"><div class="zl">Z</div><h3>Zoom</h3><p>Onde falta informação. Aprofunde ali.</p></div>
    <div class="card enter" style="--i:1"><div class="zl">P</div><h3>Potencial</h3><p>Um problema evidente, ou algo que funciona e vale aprender.</p></div>
    <div class="card enter" style="--i:2"><div class="zl">I</div><h3>Intervenção</h3><p>Algo novo a fazer, ou uma relação nova a criar.</p></div>
  </div>
  <p class="quote frag" data-f="1" style="margin-top:2.8cqw">Teste pequeno, onde o erro é barato. <span class="gt">Ajuste antes de escalar.</span></p>` },

{ b:'b5', min:2, t:'Caso Canberra', o:true,
  notes:'Conte a história de uma mãe de duas crianças, sem nome. A regra de renda decidiu, e a família ficou de fora por 1,50 dólar. Nove famílias geraram três ideias e um protótipo.',
  html:`${head('Caso · Canberra, Austrália', 'Se a renda passa por centavos, o sistema funcionou?')}
  <div class="grid g2">
    <div class="card enter" style="--i:0"><h3>A regra</h3><p>Uma mãe de duas crianças ficou fora da lista de moradia por 1,50 dólar acima do limite.</p></div>
    <div class="card enter" style="--i:1"><h3>A escuta</h3><p>Entrevistas em profundidade com nove famílias com necessidades complexas.</p></div>
    <div class="card enter" style="--i:2"><h3>As ideias</h3><p>Um profissional de referência escolhido pela família. Um perfil de informações que a família controla. Centros comunitários.</p></div>
    <div class="card dk enter" style="--i:3"><h3 style="color:#fff">O protótipo</h3><p>Testado com as famílias antes de escalar.</p></div>
  </div>` },

{ b:'b5', min:2, t:'Caso Oslo', o:true,
  notes:'Caso sensível: use tom sóbrio e só o essencial. O mapa foi feito com a equipe, não para ela.',
  html:`${head('Caso · Oslo, Noruega', 'Mapear o sistema junto com quem trabalha nele.')}
  <div class="grid g2">
    <div class="card enter" style="--i:0"><h3>O sistema</h3><p>Atendimento a vítimas de violência sexual, com pronto-socorro e polícia. Prevenção e resposta.</p></div>
    <div class="card enter" style="--i:1"><h3>O mapa</h3><p>Todo o sistema mapeado e validado com especialistas, depois a jornada da vítima.</p></div>
    <div class="card enter" style="--i:2"><h3>O efeito</h3><p>O mapa virou ferramenta da própria equipe, e a jornada foi adotada de imediato.</p></div>
    <div class="card enter" style="--i:3"><h3>As mudanças</h3><p>Produto (uma manta com bolsos para evidências), espaço e sistema de informação.</p></div>
  </div>
  <p class="quote frag" data-f="1" style="margin-top:2.6cqw;font-size:2.4cqw">O mapa que entende o sistema <span class="gt">também serve a quem trabalha nele.</span></p>` },

{ b:'b5', min:1, t:'Caso Balneário Camboriú', o:true,
  notes:'Diga que o processo documenta a cocriação, não um impacto medido. Pergunte: quem desenha o formulário já o preencheu alguma vez?',
  html:`${head('Caso · Balneário Camboriú, SC', 'Quem desenha o formulário já o preencheu?')}
  <div class="grid g3">
    <div class="card enter" style="--i:0"><h3>Antes</h3><p>Licenciamento de eventos em espaço público, um serviço burocrático.</p></div>
    <div class="card enter" style="--i:1"><h3>Depois</h3><p>Servidores resolveram o problema junto com os usuários, em ciclos repetidos.</p></div>
    <div class="card dk enter" style="--i:2"><h3 style="color:#fff">O limite</h3><p>Mostra o processo de cocriação, não o impacto.</p></div>
  </div>` },

{ b:'b5', min:1, t:'Três contribuições do design', o:true,
  notes:'Leia as três contribuições. Ligue cada uma ao que a sala já viu hoje.',
  html:`${head('Contribuições do design à política', 'O que o design faz de concreto.')}
  <div class="grid g3">
    <div class="card enter" style="--i:0"><div class="zl">1</div><h3>Definir o problema</h3><p>Delimitar o espaço do problema antes da resposta.</p></div>
    <div class="card enter" style="--i:1"><div class="zl">2</div><h3>Gerar ideias</h3><p>Desenvolver ideias e conceitos para a política.</p></div>
    <div class="card enter" style="--i:2"><div class="zl">3</div><h3>Tornar tangível</h3><p>Articular a política de forma que possa ser vista e testada.</p></div>
  </div>` },

/* ---------- Bloco 6 ---------- */
{ b:'b6', min:0, t:'Bloco 06 · Objeções que você vai ouvir', cls:'dark', meta:false,
  notes:'Anuncie o bloco: as objeções são legítimas e têm resposta.',
  html:bcov('b6','Objeções que você vai ouvir','oftoooooo','Três objeções e um caso')},

{ b:'b6', min:2, t:'Três objeções',
  notes:'Leia cada objeção antes da resposta. Para a segunda: se conhecer o cliente é caro, quanto custa não conhecê-lo?',
  html:`${head('Objeções', 'Três objeções que você vai ouvir, e o que responder.')}
  <div class="trow enter" style="--i:0"><b>“Vira ditadura do cidadão.”</b><span>O cidadão contribui para descobrir o que vai funcionar. <em>Quem decide continua sendo a instância política.</em></span><span></span></div>
  <div class="trow enter" style="--i:1;margin-top:1.4cqw"><b>“Custa caro e demora.”</b><span>Mais caro é descobrir tarde que a solução desenhada na mesa <em>não funciona.</em></span><span></span></div>
  <div class="trow enter" style="--i:2;margin-top:1.4cqw"><b>“Cria expectativa.”</b><span>É válida. <em>Seja transparente</em> sobre o que será e o que não será feito.</span><span></span></div>` },

{ b:'b6', min:2, t:'Caso Rio Doce',
  notes:'Tom descritivo: as duas posições na mesma tela, sem adjetivos e sem tomar partido. Antecedente, se perguntarem: o TAC-Gov previa comissões de atingidos, consolidadas só anos depois, com obstáculos judiciais.',
  html:`${head('Caso · Rio Doce, 2015–2024', 'Acompanhar um acordo é o mesmo que construí-lo?')}
  <p class="micro" style="font-family:Figtree,sans-serif;font-size:1.6cqw;color:var(--ink2);margin:0 0 1.8cqw">Repactuação da reparação de Mariana. Assinada em 25/10/2024: 49 municípios, 11 deles no Espírito Santo.</p>
  <div class="grid g2" style="gap:1.6cqw">
    <div class="card enter" style="--i:0"><h3>Atingidos e movimentos</h3><p>Denunciam que não participaram da negociação. O MAB reconhece avanços e aponta insuficiências.</p></div>
    <div class="card enter" style="--i:1"><h3>Instituições</h3><p>O MPF cita o anexo 6 e o Conselho Federal de Participação Social. Minas criou a IMPS/Doce, consultiva.</p></div>
  </div>
  <div class="pergunta frag" data-f="1" style="margin-top:2.4cqw;font-size:2.1cqw">Participar do acompanhamento equivale a ter participado da construção?</div>` },

{ b:'b6', min:1, t:'Resistência cultural', o:true,
  notes:'Conte que a resistência também é cultural: no Ministério das Finanças da Áustria, houve incômodo com o uso de vídeos de cidadãos em análise e decisão.',
  html:`${head('Resistência', 'Parte da objeção é cultural, não técnica.')}
  <p class="lead enter" style="--i:0">Um servidor de finanças ficou incomodado com o uso de vídeos de cidadãos na análise e na decisão.</p>
  <p class="quote frag" data-f="1" style="font-size:2.6cqw;margin-top:1.8cqw">Desconfiança de qualquer mídia que não seja <span class="gt">texto escrito.</span></p>` },

/* ---------- Bloco 7 ---------- */
{ b:'b7', min:0, t:'Bloco 07 · Decidir, sustentar e o papel do gestor', cls:'dark', meta:false,
  notes:'Anuncie o bloco: como decidimos vale tanto quanto o que decidimos.',
  html:bcov('b7','Decidir, sustentar e o papel do gestor','ftoooofoo','Decisão acordada, legitimidade desenhada')},

{ b:'b7', min:2, t:'Como decidir',
  notes:'Leia os quatro modos. Pergunte em qual deles a última decisão da equipe foi tomada.',
  html:`${head('Como decidir', 'Decidir é acordar, não descobrir.')}
  <div class="trow enter" style="--i:0;padding:1cqw 2.2cqw;background:transparent"><span class="lbl">Modo</span><span class="lbl">O que é</span><span class="lbl">O que custa</span></div>
  <div class="trow enter" style="--i:1"><b>Consenso</b><span>Todos concordam.</span><span>Alta legitimidade; risco de paralisia.</span></div>
  <div class="trow enter" style="--i:2;margin-top:1cqw"><b>Consentimento</b><span>Ninguém tem objeção grave.</span><span>Mais rápido; adesão morna.</span></div>
  <div class="trow enter" style="--i:3;margin-top:1cqw"><b>Maioria</b><span>Vota-se e decide-se.</span><span>Rápido; produz perdedores.</span></div>
  <div class="trow enter" style="--i:4;margin-top:1cqw"><b>Autoridade com escuta</b><span>Alguém decide depois de ouvir.</span><span>Realista no Estado; legítima se a escuta for de verdade.</span></div>` },

{ b:'b7', min:1, t:'Legitimidade é desenhada',
  notes:'Legitimidade vem de como decidimos. Demore em legitimidade ao listar as cinco dimensões.',
  html:`${head('Legitimidade', 'Legitimidade é desenhada, não herdada.')}
  <p class="lead enter" style="--i:0">Vem de como decidimos: transparência, inclusão e aprendizado.</p>
  <div class="grid g3" style="gap:1.2cqw;margin-top:.6cqw">
    <div class="card frag" data-f="1" style="padding:1.4cqw 1.8cqw"><h3 style="margin:0;font-size:2cqw">Experiência do cidadão</h3></div>

/* ============ MOTOR ============ */
const S = ESSENCIAIS ? ALL.filter(s => !s.o) : ALL;
const stage = document.getElementById('stage');
const app = document.getElementById('app');

/* minutos por bloco, a partir dos slides incluídos */
BLOCKS.forEach(b => { b.min = S.filter(s => s.b === b.id).reduce((a,s) => a + s.min, 0); });
const bStart = id => { let a = 0; for (const b of BLOCKS) { if (b.id === id) return a; a += b.min; } return 0; };
const TOTAL = BLOCKS.reduce((a,b) => a + b.min, 0);
let acc = 0; S.forEach(s => { s.start = acc; acc += s.min; });

const metaHTML = (s,i) => `<div class="meta"><span>Bloco ${B(s.b).n} · <b>${B(s.b).nome}</b></span><span>${String(i+1).padStart(2,'0')} / ${S.length}</span></div>`;
S.forEach((s,i) => {
  const el = document.createElement('section');
  el.className = `slide ${s.cls || ''}`;
  el.dataset.i = i;
  el.setAttribute('aria-roledescription','slide');
  el.setAttribute('aria-label', `${i+1}. ${s.t}`);
  el.innerHTML = s.html + (s.meta === false ? '' : metaHTML(s,i)) + (s.o ? '<span class="opt-tag">opcional</span>' : '');
  stage.appendChild(el);
  s.el = el;
  s.max = Math.max(0, ...[...el.querySelectorAll('[data-f]')].map(x => +x.dataset.f));
});
/* preenche minutos e horários das capas e da agenda */
document.querySelectorAll('[data-bmin]').forEach(e => e.textContent = B(e.dataset.bmin).min);
document.querySelectorAll('[data-bstart]').forEach(e => e.textContent = fmt(bStart(e.dataset.bstart)));
document.querySelectorAll('[data-bend]').forEach(e => e.textContent = fmt(bStart(e.dataset.bend) + B(e.dataset.bend).min));

/* barra de progresso */
const bar = document.getElementById('bar');
BLOCKS.forEach(b => {
  const d = document.createElement('button');
  d.className = 'seg';
  d.style.flex = Math.max(b.min, 1);
  d.title = `${b.n} · ${b.nome}`;
  d.setAttribute('aria-label', `Ir para o bloco ${b.n}: ${b.nome}`);
  d.innerHTML = '<i></i>';
  d.onclick = () => show(S.findIndex(s => s.b === b.id), 'start');
  bar.appendChild(d);
});

let cur = 0, step = 0, swapT = null;
const $ = id => document.getElementById(id);

function apply(){
  S[cur].el.querySelectorAll('[data-f]').forEach(e => {
    const f = +e.dataset.f;
    e.classList.toggle('show', f <= step);
    e.classList.toggle('act', f === step);
  });
}
function onEnter(s){
  clearTimeout(swapT);
  s.el.querySelectorAll('.swap').forEach(sw => {
    sw.classList.remove('rev');
    swapT = setTimeout(() => sw.classList.add('rev'), 900);
  });
}
function show(i, where){
  i = Math.max(0, Math.min(S.length - 1, i));
  S.forEach((s,k) => {
    if (k !== i) { s.el.classList.remove('on'); s.el.classList.toggle('past', k < i); }
  });
  const sl = S[i];
  sl.el.classList.remove('past');
  void sl.el.offsetWidth;
  sl.el.classList.add('on');
  cur = i;
  step = where === 'end' ? sl.max : 0;
  apply(); onEnter(sl); ui();
  try { history.replaceState(null, '', '#' + (i + 1)); } catch(e) {}
}
function next(){
  const sl = S[cur];
  if (step < sl.max) { step++; apply(); ui(); }
  else if (cur < S.length - 1) show(cur + 1, 'start');
}
function prev(){
  if (step > 0) { step--; apply(); ui(); }
  else if (cur > 0) show(cur - 1, 'end');
}
function ui(){
  const s = S[cur];
  $('cnt').textContent = `${cur+1} / ${S.length}`;
  const el = s.start + (s.max ? s.min * step / (s.max + 1) : 0);
  let bs = 0;
  BLOCKS.forEach((b,bi) => {
    const f = b.min ? Math.min(1, Math.max(0, (el - bs) / b.min)) : 0;
    bar.children[bi].firstChild.style.width = (f * 100) + '%';
    bs += b.min;
  });
  $('clock').textContent = `${fmt(Math.floor(el))} de ${fmt(TOTAL)} · ${s.min ? s.min + ' min' : 'agora'}`;
  if (app.classList.contains('notes-on')) {
    const nx = S[cur+1] ? S[cur+1].t : 'fim da apresentação';
    $('notes').innerHTML = `<div class="nh">Notas · ${cur+1}. ${s.t} · ${step}/${s.max} revelações</div><p>${s.notes}</p><div class="nx">Próximo: ${nx}</div>`;
  }
}
function toggleNotes(){ app.classList.toggle('notes-on'); ui(); }
function openIndex(){ $('index').hidden = false; }
function closeIndex(){ $('index').hidden = true; }
function toggleIndex(){ $('index').hidden ? openIndex() : closeIndex(); }
function fs(){ if (!document.fullscreenElement) document.documentElement.requestFullscreen?.(); else document.exitFullscreen?.(); }

/* índice */
const ix = $('index');
ix.innerHTML = `<div class="ix-h"><b>Índice · ${S.length} slides · ${fmt(TOTAL)}</b><button id="ixClose">Fechar (Esc)</button></div>` +
  BLOCKS.map(b => `<div class="ix-b"><h4>${b.n} · ${b.nome} <span>${b.min} min</span></h4><div class="ix-g">` +
    S.map((s,i) => ({s,i})).filter(o => o.s.b === b.id).map(o => `<button class="${o.s.o?'opt':''}" data-go="${o.i}"><span>${String(o.i+1).padStart(2,'0')}</span>${o.s.t}${o.s.o?' · opcional':''}</button>`).join('') +
    `</div></div>`).join('');
ix.addEventListener('click', e => {
  if (e.target.id === 'ixClose') return closeIndex();
  const b = e.target.closest('[data-go]');
  if (b) { closeIndex(); show(+b.dataset.go, 'start'); }
});

$('bp').onclick = prev;
$('bn').onclick = next;
$('bNotes').onclick = toggleNotes;
$('bIdx').onclick = toggleIndex;
$('bFs').onclick = fs;

document.addEventListener('keydown', e => {
  if (e.target.closest('input,textarea,select,[contenteditable]')) return;
  const k = e.key;
  if ((k === ' ' || k === 'Enter') && e.target.closest('button,[tabindex]')) return;
  if (['ArrowRight','PageDown',' '].includes(k)) { e.preventDefault(); next(); }
  else if (['ArrowLeft','PageUp','Backspace'].includes(k)) { e.preventDefault(); prev(); }
  else if (k === 'ArrowDown') { e.preventDefault(); show(cur + 1, 'start'); }
  else if (k === 'ArrowUp') { e.preventDefault(); show(cur - 1, 'start'); }
  else if (k === 'Home') show(0, 'start');
  else if (k === 'End') show(S.length - 1, 'start');
  else if (k === 'n' || k === 'N') toggleNotes();
  else if (k === 'g' || k === 'G') toggleIndex();
  else if (k === 'f' || k === 'F') fs();
  else if (k === 'Escape') closeIndex();
});

let tx = null;
stage.addEventListener('touchstart', e => { tx = e.touches[0].clientX; }, {passive:true});
stage.addEventListener('touchend', e => {
  if (tx === null) return;
  const dx = e.changedTouches[0].clientX - tx; tx = null;
  if (dx < -50) next(); else if (dx > 50) prev();
}, {passive:true});

document.addEventListener('click', e => {
  const v = e.target.closest('.vopt');
  if (v) {
    v.dataset.c = +v.dataset.c + 1;
    const os = [...v.closest('.vote').querySelectorAll('.vopt')];
    const tot = os.reduce((a,o) => a + +o.dataset.c, 0) || 1;
    os.forEach(o => {
      o.querySelector('.vn').textContent = o.dataset.c;
      o.querySelector('.vb i').style.width = (o.dataset.c / tot * 100) + '%';
    });
    const n = v.querySelector('.vn'); n.classList.add('bump'); setTimeout(() => n.classList.remove('bump'), 250);
    return;
  }
  const tb = e.target.closest('.tbtn');
  if (tb) {
    const t = tb.closest('.timer');
    if (t.classList.contains('run')) { t.classList.remove('run'); }
    else {
      if (+t.dataset.rem <= 0) t.dataset.rem = t.dataset.tot;
      t.classList.remove('done'); t.classList.add('run');
    }
    tupd(t); return;
  }
  const ct = e.target.closest('.ctile');
  if (ct) { ct.classList.toggle('done'); return; }
  const fl = e.target.closest('.flip');
  if (fl) { fl.classList.toggle('show'); return; }
  const sw = e.target.closest('.swap');
  if (sw) { sw.classList.toggle('rev'); return; }
});
document.addEventListener('keydown', e => {
  if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('.flip,.swap')) { e.preventDefault(); e.target.click(); }
});
function tupd(t){
  const tot = +t.dataset.tot, r = +t.dataset.rem;
  t.querySelector('.tt').textContent = r > 0 ? `${Math.floor(r/60)}:${String(r%60).padStart(2,'0')}` : 'Tempo!';
  t.querySelector('.tp').style.strokeDashoffset = 106.81 * (1 - r / tot);
}
setInterval(() => {
  document.querySelectorAll('.timer.run').forEach(t => {
    let r = +t.dataset.rem - 1;
    if (r <= 0) { r = 0; t.classList.remove('run'); t.classList.add('done'); }
    t.dataset.rem = r; tupd(t);
  });
}, 1000);

document.addEventListener('mousemove', e => {
  if (!S[cur] || !S[cur].el.classList.contains('cover')) return;
  const r = stage.getBoundingClientRect();
  const x = (e.clientX - r.left) / r.width - .5, y = (e.clientY - r.top) / r.height - .5;
  S[cur].el.querySelectorAll('.dp').forEach(d => {
    const k = +d.dataset.depth;
    d.style.transform = `translate(${x * k * 2.2}cqw, ${y * k * 2.2}cqw)`;
  });
});

setTimeout(() => $('hint').classList.add('off'), 7000);
const h = parseInt(location.hash.slice(1), 10);
show(isNaN(h) ? 0 : h - 1, 'start');
</script>
